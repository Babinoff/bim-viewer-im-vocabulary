<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.js"></script> -->
    <title>Document</title>
    <style>
      /* Стили для диалога */
      dialog {
          border: 1px solid #ccc;
          border-radius: 8px;
          padding: 20px;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
          width: 300px; /* Немного шире для удобства */
      }
      dialog::backdrop {
          background: rgba(0, 0, 0, 0.5);
      }
      label {
          display: block;
          margin-bottom: 10px;
          font-weight: bold;
      }
      .input-group {
          display: flex;
          align-items: center;
          margin-bottom: 15px;
      }
      .input-group label {
          flex: 1; /* Лейбл занимает доступное пространство */
          margin-right: 10px; /* Отступ между лейблом и инпутом */
      }
      .input-group input {
          width: 150px; /* Фиксированная ширина инпутов */
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 4px;
          text-align: right; /* Выравнивание текста в инпуте по правому краю */
      }
      button {
          padding: 8px 16px;
          border: none;
          border-radius: 4px;
          background-color: #007bff;
          color: white;
          cursor: pointer;
      }
      button:hover {
          background-color: #0056b3;
      }
      body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
      }
      
      #app-container {
          position: relative;
          width: 100%;
          height: 100%;
      }
      
      #viewer-container {
          width: 100%;
          height: 100%;
      }
      
      #custom-buttons {
          position: absolute;
          top: 20px;
          right: 20px;
          z-index: 1000; /* Важно: кнопки должны быть выше вьювера */
      }
      
      .custom-btn {
          /* background: #4CAF50; */
          color: white;
          border: none;
          padding: 10px 15px;
          margin: 5px;
          border-radius: 4px;
          cursor: pointer;
      }

      .progress-container {
        position: absolute;
        margin: 20px 0;
      }

      .progress-bar {
          width: 100%;
          height: 20px;
          background-color: #f1f1f1;
          border-radius: 10px;
          overflow: hidden;
      }

      .progress {
          height: 100%;
          background-color: #4CAF50;
          transition: width 0.3s ease;
      }

      .progress-text {
          text-align: center;
          margin-top: 5px;
          font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="viewer-container"></div>
    <div id="custom-buttons">
      <button class="custom-btn" id="btnAllKsi">Заполнить КСИ для всех элементов</button>
    </div>
    <div class="progress-container" style="display: none;">
      <div class="progress-bar">
          <div class="progress" id="progressBar" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
    <script type="module" src="bundle.js"></script>
    <script>
    </script>
  </body>
  <dialog id="dialog">
    <form id="inputForm">
      <p>
        <br>
        <label>
          Номер захватки:
          <input id="input_RUS_DivisionNumber" type="text" />
        </label>
        <br>
        <label>
          Плановая дата начала работ:
          <input id="input_RUS_StartDatePlan" type="text" />
        </label>
        <br>
        <label>
          Фактическая дата начала работ:
          <input id="input_RUS_StartDateIs" type="text" />
        </label>
        <br>
        <label>
          Плановая дата окончания работ:
          <input id="input_RUS_EndDatePlan" type="text" />
        </label>
        <br>
        <label>
          Фактическая дата окончания работ:
          <input id="input_RUS_EndDateIs" type="text" />
        </label>
      </p>
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>KIS info</h2>
        <br>
        <div class="form-group">
          <label for="ksi_info">Код:</label>
          <input type="text" id="ksi_info" readonly
            placeholder="Здесь будет отображаться информация">
        </div>
        <br>
        <div>
          <button id="getData" type="button" class="btn-secondary">Запрос кода у ИИ</button>
        </div>
        <br>
        <div>
          <button id="sendData" type="button" class="btn-primary">Записать код</button>
        </div>
      </div>
      <br>
      </div>
      <div>
        <input type="submit" id="js-close" value="Сохранить" />
      </div>
    </form>
  </dialog>
</html>
